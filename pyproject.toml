[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisarhdf"
version = "0.0.4"
description = "Tools for NISAR GPS cal/val data"
authors = [
    { name = "Ian Joughin", email = "irj@uw.edu" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["SAR", "NISAR"]
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyproj",
    "geopandas",
    "rasterio",
    "matplotlib",
    "s3fs",
    "geojson",
    "rioxarray",
    "gdal"
]

[project.optional-dependencies]
# Modern widget themes for showimage's control palette (--theme arc, equilux,
# yaru, ...). Optional: without it showimage falls back to Tk's own 'clam'.
gui = ["ttkthemes"]

[tool.setuptools]
packages = ["nisarhdf"]

[project.urls]
Homepage = "https://github.com/fastice/nisarhdf"
Repository = "https://github.com/fastice/nisarhdf"

[project.scripts]
nisarh5toimage = "nisarhdf.nisarH5ToImage:run"
multilookrslc = "nisarhdf.multilookRSLC:run"
s3ls = "nisarhdf.s3Listing:run"
showimage = "nisarhdf.showimage:main"
showvel = "nisarhdf.showimage:showvel"
showoffsets = "nisarhdf.showimage:showoffsets"
